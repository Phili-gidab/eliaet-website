# BEGIN ELIA site
# The ELIA website runs as a Node.js app (cPanel > Setup Node.js App: its own lines are the CLOUDLINUX PASSENGER
# block in this file, which these leave alone). The app answers every address itself; here only plain http:// is
# sent on to https://, and folder listings are off. Written by deploy-elia.sh: changes here are replaced next time.
Options -Indexes
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteCond %{HTTP:X-Forwarded-Proto} !=https
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</IfModule>
# END ELIA site
