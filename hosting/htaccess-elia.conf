# BEGIN ELIA site
# Apache rules for the ELIA site on PHP hosting (for now elia.allafricanleatherfair.org). hosting/deploy-elia.sh adds
# this block to the site folder's .htaccess, between these markers, and leaves anything cPanel keeps there.
# hosting/bundle.mjs fills in the hashes of the pages' small inline scripts in the Content-Security-Policy.
DirectoryIndex index.html
ErrorDocument 404 /404.html

<IfModule mod_rewrite.c>
    RewriteEngine On

    # HTTPS only (cPanel AutoSSL; a new subdomain gets its certificate within minutes to a few hours)
    RewriteCond %{HTTPS} !=on
    RewriteCond %{HTTP:X-Forwarded-Proto} !https
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    # the forms: /api/contact is api/contact.php
    RewriteRule ^api/(contact|appointments|subscribe|membership)/?$ api/$1.php [END]

    # the old eliaet.com addresses that changed
    RewriteRule ^blog\.html$ /news [R=301,L,NC]
    RewriteRule ^members-list\.html$ /members [R=301,L,NC]
    RewriteRule ^apply-for-membership\.html$ /membership [R=301,L,NC]
    RewriteRule ^img/(.+)\.(jpe?g|png)$ /media/$1.webp [R=301,L,NC]

    # pages have clean addresses: /about.html and /index.html (typed or linked) go to /about and /
    RewriteCond %{THE_REQUEST} \s/+index\.html[\s?] [NC]
    RewriteRule ^ / [R=301,L]
    RewriteCond %{THE_REQUEST} \s/+([^\s?]+?)\.html[\s?] [NC]
    RewriteRule ^ /%1 [R=301,L,NE]

    # folders are never listed
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^.+$ - [R=404,L]

    # a trailing slash is dropped (/about/ goes to /about)
    RewriteRule ^(.+)/$ /$1 [R=301,L]

    # and /about is about.html
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME}.html -f
    RewriteRule ^(.+)$ $1.html [END]
</IfModule>

# File types: the pictures, the films (AV1 and H.264 in .mp4, VP9 in .webm), the typefaces
AddType image/webp .webp
AddType image/svg+xml .svg
AddType video/mp4 .mp4
AddType video/webm .webm
AddType font/woff2 .woff2
AddType text/javascript .js .mjs
AddType application/json .json

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' __SCRIPT_HASHES__; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; media-src 'self' blob:; frame-src https://www.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
    # a temporary home: kept out of search engines until the site moves to its own address
    Header always set X-Robots-Tag "noindex, nofollow"
</IfModule>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json image/svg+xml text/plain text/xml
</IfModule>

<IfModule mod_expires.c>
    ExpiresActive On
    # pages change with every upload: browsers check for a newer copy each visit
    ExpiresByType text/html "access plus 0 seconds"
    # pictures: a week; the film poster and stills too
    ExpiresByType image/webp "access plus 7 days"
    ExpiresByType image/jpeg "access plus 7 days"
    ExpiresByType image/png "access plus 7 days"
    ExpiresByType image/svg+xml "access plus 7 days"
    # the films are the heaviest files and change rarely: a month
    ExpiresByType video/mp4 "access plus 30 days"
    ExpiresByType video/webm "access plus 30 days"
    # the pins that ride on the home film
    ExpiresByType application/json "access plus 1 day"
    # scripts, styles and typefaces live in _assets/ with a fingerprint in their names (its own .htaccess: a year)
</IfModule>

# Never serve notes, data or scripts, even if one lands here by mistake
<FilesMatch "\.(csv|log|bak|md|sh|py|conf|ini|sql|env|tar|gz|zip)$">
    Require all denied
</FilesMatch>
<Files ".elia-media">
    Require all denied
</Files>
# END ELIA site
